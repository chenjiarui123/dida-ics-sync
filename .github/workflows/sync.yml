name: Dida ICS Sync (Gist)
run-name: Sync Dida Calendar -> Secret Gist
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install icalendar requests

      - name: Fetch current gist content (baseline)
        run: |
          URL="https://gist.githubusercontent.com/${{ github.repository_owner }}/${{ secrets.GIST_ID }}/raw/converted.ics"
          if curl -fsSL "$URL" -o converted.ics; then
            echo "已获取 Gist 现有内容"
          else
            rm -f converted.ics
            echo "Gist 暂无可读内容，按首次生成处理"
          fi
          [ -f converted.ics ] && cp -f converted.ics baseline.ics || true

      - name: Run convert script
        env:
          DIDA_ICS_URL: ${{ secrets.DIDA_ICS_URL }}
        run: python convert.py

      - name: Update gist if changed
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          # 统一把 baseline 与新内容都规整成 CRLF 再比较，避免 \r\n 与 \n 造成的
          # 假变更（否则每 10 分钟都会误判为“有变化”而反复 PATCH）。
          python - <<'PY'
          import pathlib, json
          def norm(p):
              b = pathlib.Path(p).read_bytes()
              return b.replace(b"\r\n", b"\n").replace(b"\n", b"\r\n")
          new = norm("converted.ics")
          pathlib.Path("converted.ics").write_bytes(new)
          base_path = pathlib.Path("baseline.ics")
          base = norm("baseline.ics") if base_path.exists() else None
          if base is not None and base == new:
              print("内容无变化，跳过 Gist 更新")
              pathlib.Path("/tmp/changed").write_text("0")
          else:
              payload = {"files": {"converted.ics": {"content": new.decode("utf-8")}}}
              pathlib.Path("/tmp/payload.json").write_text(json.dumps(payload), encoding="utf-8")
              pathlib.Path("/tmp/changed").write_text("1")
              print("检测到变化，准备更新 Gist")
          PY
          if [ "$(cat /tmp/changed)" = "1" ]; then
            gh api --method PATCH "/gists/${GIST_ID}" --input /tmp/payload.json > /dev/null
            echo "已更新 Gist"
          fi

      - name: Keep schedule alive (daily heartbeat)
        run: |
          d=$(date -u +%F)
          if [ "$(cat .heartbeat 2>/dev/null)" != "$d" ]; then
            echo "$d" > .heartbeat
            git config user.name "actions-bot"
            git config user.email "actions@github.com"
            git add .heartbeat
            git commit -m "heartbeat ${d}" || exit 0
            git push || true
          fi
