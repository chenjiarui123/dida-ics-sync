name: Dida -> iCloud Calendar Sync

on:
  # 定时触发已交给 Cloudflare Worker（每 1 分钟 dispatch 一次），此处仅保留手动触发
  workflow_dispatch:

concurrency:
  group: dida-icloud-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install caldav icalendar requests

      - name: Sync to iCloud
        env:
          DIDA_ICS_URL: ${{ secrets.DIDA_ICS_URL }}
          ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ICLOUD_CALENDAR: ${{ secrets.ICLOUD_CALENDAR }}
          ICLOUD_CALDAV_URL: ${{ secrets.ICLOUD_CALDAV_URL }}
          # 所有事件统一改写成当天 23:58→23:59 的 1 分钟事件（可自行调整）
          FIX_HOUR: "23"
          FIX_MINUTE: "58"
          FIX_DURATION_MIN: "1"
        run: python sync_icloud.py
