name: Dida -> iCloud Calendar Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: dida-icloud-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install caldav icalendar requests

      - name: Sync to iCloud
        env:
          DIDA_ICS_URL: ${{ secrets.DIDA_ICS_URL }}
          ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ICLOUD_CALENDAR: ${{ secrets.ICLOUD_CALENDAR }}
          FIX_HOUR: "23"
          FIX_MINUTE: "58"
          FIX_DURATION_MIN: "1"
        run: python sync_icloud.py
